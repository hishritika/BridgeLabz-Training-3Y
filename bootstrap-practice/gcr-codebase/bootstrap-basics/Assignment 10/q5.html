<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center p-4">
        <h1>My Blog</h1>
        <p>Simple thoughts and ideas</p>
    </header>

    <!-- Blog posts -->
    <main class="container my-4">

        <div class="row">

            <!-- Blog Post 1 -->
            <div class="col-12 col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="card-title">Learning Web Development</h2>

                        <p class="card-text">
                            Web development is an interesting field where we can
                            create websites and learn new technologies.
                        </p>

                        <button class="btn btn-primary">Read More</button>
                    </div>
                </div>
            </div>

            <!-- Blog Post 2 -->
            <div class="col-12 col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="card-title">Why Learn Bootstrap?</h2>

                        <p class="card-text">
                            Bootstrap helps us create responsive websites easily
                            using ready-made classes and components.
                        </p>

                        <button class="btn btn-primary">Read More</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white text-center p-3">
        <p class="mb-0">© 2026 My Blog</p>
    </footer>

</body>
</html>
