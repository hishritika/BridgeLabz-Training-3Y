<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q4.css">
</head>

<body>

    <main class="container my-4">

        <!-- Restaurant heading -->
        <section class="text-center">
            <h1>Food Corner</h1>
            <p class="lead">Today's Menu</p>
        </section>

        <!-- Food image -->
        <section class="text-center mb-4">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
                 class="img-fluid"
                 alt="Restaurant Food">

            <p class="mt-2">Fresh and tasty food prepared for you.</p>
        </section>

        <!-- Menu table -->
        <section>
            <h2 class="text-center">Menu</h2>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Margherita Pizza</td>
                        <td>Pizza</td>
                        <td>₹299</td>
                    </tr>

                    <tr>
                        <td>Veg Burger</td>
                        <td>Burger</td>
                        <td>₹149</td>
                    </tr>

                    <tr>
                        <td>White Sauce Pasta</td>
                        <td>Pasta</td>
                        <td>₹249</td>
                    </tr>

                    <tr>
                        <td>Cold Coffee</td>
                        <td>Drinks</td>
                        <td>₹129</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Chef's specials -->
        <section class="mt-4">
            <h2>Chef's Specials</h2>

            <ul class="list-group">
                <li class="list-group-item">Paneer Tikka</li>
                <li class="list-group-item">Cheese Pizza</li>
                <li class="list-group-item">Chocolate Brownie</li>
            </ul>
        </section>

    </main>

</body>
</html>
