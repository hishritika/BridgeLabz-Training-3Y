<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Agency</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Main Content -->
    <main class="flex-grow-1">

        <div class="container mt-4">

            <div class="text-center mb-3">
                <h1>Travel Agency</h1>
                <p>Explore Beautiful Destinations</p>
            </div>

            <!-- Carousel -->
            <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

                <div class="carousel-inner">

                    <div class="carousel-item active" data-bs-interval="3000">
                        <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1200&q=80"
                             class="d-block w-100"
                             style="height: 350px; object-fit: cover;">

                        <div class="carousel-caption">
                            <h3>Bali</h3>
                            <p>Enjoy the beautiful beaches of Bali.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="3000">
                        <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1200&q=80"
                             class="d-block w-100"
                             style="height: 350px; object-fit: cover;">

                        <div class="carousel-caption">
                            <h3>Paris</h3>
                            <p>Visit the beautiful city of Paris.</p>
                        </div>
                    </div>

                    <div class="carousel-item" data-bs-interval="3000">
                        <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1200&q=80"
                             class="d-block w-100"
                             style="height: 350px; object-fit: cover;">

                        <div class="carousel-caption">
                            <h3>Tokyo</h3>
                            <p>Explore the amazing city of Tokyo.</p>
                        </div>
                    </div>

                </div>

                <button class="carousel-control-prev"
                        type="button"
                        data-bs-target="#travelCarousel"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next"
                        type="button"
                        data-bs-target="#travelCarousel"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>

            <!-- Progress Bar -->
            <div class="mt-4 mb-5">

                <h4>Booking Completion</h4>

                <div class="progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                         style="width: 70%;">
                        70%
                    </div>
                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">

        <p class="mb-1">Contact Us: travelagency@gmail.com</p>
        <p class="mb-0">Phone: 9876543210</p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
