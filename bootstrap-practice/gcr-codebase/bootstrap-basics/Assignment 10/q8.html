<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Choose Your Plan</h1>

        <div class="row">

            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card text-center">

                    <div class="card-body">

                        <h2>Basic</h2>

                        <h4>₹499 / month</h4>

                        <ul class="list-group mt-3 mb-3">
                            <li class="list-group-item">5 Projects</li>
                            <li class="list-group-item">Basic Support</li>
                            <li class="list-group-item">1 User</li>
                        </ul>

                        <button class="btn btn-secondary">
                            Choose Plan
                        </button>

                    </div>

                </div>
            </div>


            <!-- Pro Plan -->
            <div class="col-md-4">

                <div class="card text-center bg-primary text-white">

                    <div class="card-body">

                        <h2>Pro</h2>

                        <h4>₹999 / month</h4>

                        <ul class="list-group mt-3 mb-3 text-dark">
                            <li class="list-group-item">20 Projects</li>
                            <li class="list-group-item">Priority Support</li>
                            <li class="list-group-item">5 Users</li>
                        </ul>

                        <button class="btn btn-light">
                            Choose Plan
                        </button>

                    </div>

                </div>

            </div>


            <!-- Premium Plan -->
            <div class="col-md-4">

                <div class="card text-center">

                    <div class="card-body">

                        <h2>Premium</h2>

                        <h4>₹1499 / month</h4>

                        <ul class="list-group mt-3 mb-3">
                            <li class="list-group-item">Unlimited Projects</li>
                            <li class="list-group-item">24/7 Support</li>
                            <li class="list-group-item">10 Users</li>
                        </ul>

                        <button class="btn btn-secondary">
                            Choose Plan
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
