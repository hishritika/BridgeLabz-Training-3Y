<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <main class="container mt-4">

        <!-- Page heading -->
        <h1 class="text-center mb-4">Notifications</h1>

        <!-- Summary well -->
        <section class="bg-light border p-3 mb-4">
            <h3>Summary</h3>
            <p>You have 3 new notifications. Check the messages below.</p>
        </section>

        <!-- Card for notifications -->
        <div class="card p-3">

            <!-- Success alert -->
            <div class="alert alert-success">
                <strong>Success!</strong> Your profile has been updated.
            </div>

            <!-- Info alert -->
            <div class="alert alert-info">
                <strong>Info:</strong> You have a new message.
            </div>

            <!-- Danger alert -->
            <div class="alert alert-danger">
                <strong>Warning!</strong> Your password will expire soon.
            </div>

            <!-- Dismissible alert -->
            <div class="alert alert-warning alert-dismissible fade show">
                <strong>Notice:</strong> Please check your account details.

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

        </div>

    </main>

</body>

</html>
