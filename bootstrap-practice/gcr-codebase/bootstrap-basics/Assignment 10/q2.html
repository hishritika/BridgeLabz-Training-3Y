<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <main>

        <!-- Portfolio intro -->
        <section class="container text-center mt-4 mb-3 p-5 bg-light">

            <h1 class="fw-bold">Shritika</h1>

            <p class="text-dark">
                Web Developer | Cyber Security Student
            </p>

            <!-- Profile image -->
            <img src="./images/WhatsApp Image 2026-05-31 at 3.04.15 PM.jpeg"
                class="img-fluid rounded-circle"
                width="150"
                alt="Profile Image">

            <p class="mt-4">
                I am a student interested in web development and
                learning new technologies.
            </p>

            <!-- Buttons -->
            <div class="mt-3">
                <button class="btn btn-primary mx-2">
                    Hire Me
                </button>

                <button class="btn btn-secondary mx-2">
                    Download CV
                </button>
            </div>

        </section>

        <!-- Contact form -->
        <section class="container text-center mb-5">

            <h3>Contact Me</h3>

            <form class="mt-3">

                <input type="text"
                    class="form-control mb-3"
                    placeholder="Enter your name">

                <input type="email"
                    class="form-control mb-3"
                    placeholder="Enter your email">

                <textarea
                    class="form-control mb-3"
                    rows="4"
                    placeholder="Enter your message"></textarea>

                <button class="btn btn-primary">
                    Submit
                </button>

            </form>

        </section>

    </main>

</body>

</html>
