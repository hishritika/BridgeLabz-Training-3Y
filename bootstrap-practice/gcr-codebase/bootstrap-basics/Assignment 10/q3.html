<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <main class="container mt-4">

        <h1 class="text-center mb-4">Our Products</h1>

        <!-- Product grid -->
        <div class="row">

            <!-- Product 1 -->
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="p-3 shadow-sm product-card">

                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                        class="img-fluid"
                        alt="Watch">

                    <h4 class="mt-3">Smart Watch</h4>

                    <p>Price: ₹2,499</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="p-3 shadow-sm product-card">

                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                        class="img-fluid"
                        alt="Headphones">

                    <h4 class="mt-3">Headphones</h4>

                    <p>Price: ₹1,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="p-3 shadow-sm product-card">

                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                        class="img-fluid"
                        alt="Shoes">

                    <h4 class="mt-3">Running Shoes</h4>

                    <p>Price: ₹2,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="p-3 shadow-sm product-card">

                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"
                        class="img-fluid"
                        alt="Camera">

                    <h4 class="mt-3">Camera</h4>

                    <p>Price: ₹4,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>

        </div>

    </main>

</body>

</html>
