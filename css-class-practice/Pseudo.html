<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes & Elements</title>
    <style>
        .text1:hover {
            color: blue;
        }
        .text1:hover{
            color: red;
            cursor: crosshair;
        }


        .btn{
            background-color: yellow;
            border: 2px solid black;
            border-radius: 2px;
            padding: 1rem 2rem;
            /* display: none; */
            /* visibility: hidden; */
            transition: backgroud-color .3s ease;
        }


        .btn:hover{
            background-color: red;
            color: white;
            border: 2px solid pink;
            cursor: pointer;
        }

        #name:focus{
            border: 2px solid red;
            outline: none;
            border-radius: 5px;
        }

        .fruits{
            background-color: rgb(183, 104, 120);

        }


        .fruits li:first-child {
            background-color: aqua;
        }

        .fruits li:last-child {
            background-color: aquamarine;
        }

        .fruits li:nth-child(3) {
            background-color: pink;
        }

        .fruits li:nth-child(even){
            background-color: rgb(104, 172, 203);
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: cornflowerblue;
            border: 3px solid black;
            border-radius: 6px;
            transition: transform .3s linear;
        }

        .box:hover {
            /* transform: translateX(5rem);
            transform: translateY(5rem);
            transform: translate(5rem, 3rem);
            transform: scale(1.3); */
            transform: rotate(100deg);
        }

        .text {
            position: relative;
            display: inline-block;
        }

        .text::after{
            content: '';
            height: 3px;
            width: 0%;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: crimson;
            transition: width .5s ease-in;

        }

        .text:hover::after {
            width: 100%;
        }

        /* .text::before{
            content: 'Previous';
        } */
    </style>
</head>
<body>
    <h1 class="text1"> Hello</h1>
    <button class="btn">Click me</button>
    <br>
    <br>
    <br>
    <br>
    <label for="name">Enter Name</label>
    <br>
    <br>
    <input type="text" id="name" placeholder="Enter Name">

    <ul class="fruits">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Papaya</li>
        <li>Dragon fruit</li>
    </ul>

    <br>
    <br>

    <div class="box">
        <h1></h1>
    </div>

    <br>
    <br>
    <br>

    <h1 class="text">Hello</h1>
</body>
</html>
