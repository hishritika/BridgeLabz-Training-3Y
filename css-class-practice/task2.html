<html lang="en">

<head>

    <style>

        .sidebar {

            width: var(--sidebar-width);

            min-height: 100vh;

            background-color: var(--bg-sidebar);

            border-right: 0.6px solid var(--border-color);

            display: flex;

            flex-direction: column;

            padding: 18px 14px;

        }


        /* =========================
           SIDEBAR HEADER
        ========================= */

        .sidebar-header {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 8px 8px 20px;

            border-bottom: 1px solid var(--border-color);

        }


        .sidebar-icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background-color: #FFFFFF;

            display: flex;

            align-items: center;

            justify-content: center;

        }

    </style>

</head>

<body>


    <div class="container">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">


            <!-- BRAND -->

            <div class="sidebar-header">

                <div class="sidebar-icon">
                    A
                </div>

                <div class="brand-info">

                    <span class="brand-name">
                        ApexCore
                    </span>

                    <span class="brand-plan">
                        PRO PLATFORM
                    </span>

                </div>

            </div>

        </aside>

    </div>


</body>

</html>
