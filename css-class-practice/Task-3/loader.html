<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 5px solid white;
            border-radius: 50%;
            border-top: 3px solid red;
            animation: loader 1s linear infinite;
        }

        @keyframes loader {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
