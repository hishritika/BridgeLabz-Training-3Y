<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
    <style>

        .slider {
            width: 2000px;
            height: 300px;
            overflow: hidden;
        }

        .slides {
            display: flex;
            width: 1500px;
            animation: slider  9s infinite;
        }
        .slides img {
            width: 500px;
            height: 300px;
            object-fit: cover;
        }

        @keyframes slider {
            0% {
                transform: translateX(2000px);
            }

            30% {
                transform: translateX(-500px);
            }

            60% {
                transform: translateX(-1000px);
            }

            100% {
                transform: translateX(1000px);
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img src="./images/nature.jpg" alt="">
            <img src="./images/nature1.jpg" alt="">
            <img src="./images/nature2.jpg" alt="">
            <img src="./images/nature3.jpg" alt="">
        </div>
    </div>
</body>
</html>
