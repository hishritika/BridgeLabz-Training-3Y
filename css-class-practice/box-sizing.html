<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-sizing</title>
    <style>
    *{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* mandatory to write these 3 lines in CSS */
}
html{
    font-size: 32px;
}

.box{
    font-size: 64px;
}
.box p{
    font-size: 2em;
}


  .box{
  width: 90vw;
  height: 30%;
  background-color: red;
  margin: 50px;
  border: 10px solid black;
  padding: 15px;
  box-shadow: 10px 10px 15px black;
}

.box2{
  width:100px;
  height: 100px;
  margin-top: 50px;
  background-color: yellow;
  border: 20px solid black;
  padding: 15px;
}
    </style>
</head>
<body>
    <div class="box"></div>
    <!-- <div class="box2"></div> -->
    <div class="box">
        <p>Hello my name is Shree</p>
    </div>
</body>
</html>
