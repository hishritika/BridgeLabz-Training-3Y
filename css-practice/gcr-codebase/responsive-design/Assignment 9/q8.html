<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main>
        <h1>Filter Comparison</h1>

        <section class="comparison">

            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Original landscape">
                <h2>Before</h2>
                <p>Original Image</p>
            </div>

            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Filtered landscape">
                <h2>After</h2>
                <p>Brightness Filter</p>
            </div>

        </section>
    </main>

</body>
</html>
