<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <main>
        <section class="gallery-section">

            <h1>Responsive Image Filter Gallery</h1>

            <div class="gallery">

                <div class="image-card">
                    <img 
                        class="blur-image"
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                        alt="Nature landscape"
                    >
                    <p>Blur Filter</p>
                </div>

                <div class="image-card">
                    <img 
                        class="grayscale-image"
                        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                        alt="Mountain landscape"
                    >
                    <p>Grayscale Filter</p>
                </div>

                <div class="image-card">
                    <img 
                        class="sepia-image"
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                        alt="Forest landscape"
                    >
                    <p>Sepia Filter</p>
                </div>

                <div class="image-card">
                    <img 
                        class="brightness-image"
                        src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
                        alt="Beautiful nature"
                    >
                    <p>Brightness Filter</p>
                </div>

                <div class="image-card">
                    <img 
                        class="contrast-image"
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                        alt="Green forest"
                    >
                    <p>Contrast Filter</p>
                </div>

                <div class="image-card">
                    <img 
                        class="hue-image"
                        src="https://images.unsplash.com/photo-1511497584788-876760111969"
                        alt="Forest trees"
                    >
                    <p>Hue Rotate Filter</p>
                </div>

            </div>

        </section>
    </main>

</body>
</html>
