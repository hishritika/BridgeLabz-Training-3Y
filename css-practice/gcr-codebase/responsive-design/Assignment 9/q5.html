<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>

    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <main>
        <section class="profiles">

            <h1>Our Profiles</h1>

            <div class="profile-container">

                <div class="profile-card">
                    <img
                        class="grayscale-image"
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e"
                        alt="Profile person"
                    >

                    <div class="profile-text">
                        <h2>Alex</h2>
                        <p>
                            A creative designer who enjoys creating
                            simple and useful designs.
                        </p>
                    </div>
                </div>

                <div class="profile-card">
                    <img
                        class="sepia-image"
                        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
                        alt="Profile person"
                    >

                    <div class="profile-text">
                        <h2>Emma</h2>
                        <p>
                            A developer interested in building
                            responsive web applications.
                        </p>
                    </div>
                </div>

                <div class="profile-card">
                    <img
                        class="grayscale-image"
                        src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d"
                        alt="Profile person"
                    >

                    <div class="profile-text">
                        <h2>John</h2>
                        <p>
                            A technology enthusiast who loves
                            learning new web technologies.
                        </p>
                    </div>
                </div>

            </div>

        </section>
    </main>

</body>
</html>
