<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <header>
        <h1>Combined Effects Demonstration</h1>
        <p>Hover over the buttons to see combined CSS effects.</p>
    </header>

    <main>

        <section class="effects">

            <button class="effect-button button-one">
                Hover Me
            </button>

            <button class="effect-button button-two">
                Grow Me
            </button>

            <button class="effect-button button-three">
                Try Me
            </button>

        </section>

    </main>

    <footer>
        <p>CSS Combined Effects Practice</p>
    </footer>

</body>
</html>
