<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips.</p>
    </header>

    <main>

        <section class="tooltip-container">

            <div class="tooltip-box">
                <span>Home</span>
                <div class="tooltip">Go to Home</div>
            </div>

            <div class="tooltip-box">
                <span>About</span>
                <div class="tooltip">About Us</div>
            </div>

            <div class="tooltip-box">
                <span>Contact</span>
                <div class="tooltip">Contact Us</div>
            </div>

            <div class="tooltip-box">
                <span>Help</span>
                <div class="tooltip">Need Help?</div>
            </div>

        </section>

    </main>

    <footer>
        <p>CSS Tooltip Practice</p>
    </footer>

</body>
</html>
