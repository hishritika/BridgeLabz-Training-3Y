<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
        <p>Understanding the difference between content-box and border-box</p>
    </header>

    <main>

        <section class="boxes">

            <div class="box default-box">
                <h2>Default Box</h2>
                <p>
                    This box uses the default box-sizing property:
                    content-box.
                </p>
            </div>

            <div class="box border-box">
                <h2>Border-Box</h2>
                <p>
                    This box uses box-sizing: border-box, so
                    padding and border are included in the total size.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>CSS Box-Sizing Practice</p>
    </footer>

</body>
</html>
