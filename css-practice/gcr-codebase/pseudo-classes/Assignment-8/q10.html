<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>

<body>

    <header>
        <h1>Mini User Interface</h1>
        <p>Simple and responsive user interface</p>
    </header>

    <main>

        <section class="card">

            <div class="content">

                <div class="form-section">

                    <h2>Contact Us</h2>

                    <form>

                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                        >

                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >

                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            placeholder="Enter your message"
                        ></textarea>

                        <div class="buttons">
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                        </div>

                    </form>

                </div>

                <div class="image-section">
                    <img
                        src="https://picsum.photos/250/200"
                        alt="Small decorative image"
                    >
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Mini UI Practice</p>
    </footer>

</body>
</html>
