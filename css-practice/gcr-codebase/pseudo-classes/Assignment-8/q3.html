<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect.</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/id/1018/500/350" alt="Landscape">
                <figcaption>Green Landscape</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Lovely Companion</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/id/1035/500/350" alt="River">
                <figcaption>Peaceful River</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <figcaption>Forest Adventure</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Showcase Practice</p>
    </footer>

</body>
</html>
