<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <h1>Choose Your Plan</h1>

    <main class="pricing-container">

        <section class="pricing-card">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <p>5 Projects</p>
            <p>Basic Support</p>
            <p>1 User</p>
            <button>Get Started</button>
        </section>


        <section class="pricing-card middle-card">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>15 Projects</p>
            <p>Priority Support</p>
            <p>5 Users</p>
            <button>Get Started</button>
        </section>


        <section class="pricing-card">
            <h2>Professional</h2>
            <p class="price">₹1499</p>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <p>10 Users</p>
            <button>Get Started</button>
        </section>

    </main>

</body>

</html>
