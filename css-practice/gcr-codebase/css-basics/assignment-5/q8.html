<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Separate CSS file -->
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <!-- Fixed Header -->
    <header class="header">
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <h2>Welcome Back!</h2>

            <div class="content-container">

                <!-- Content Box 1 -->
                <section class="content-box">
                    <h3>Recent Projects</h3>
                    <p>
                        Here you can view and manage your recent projects
                        and activities.
                    </p>
                </section>

                <!-- Content Box 2 -->
                <section class="content-box">
                    <h3>Statistics</h3>
                    <p>
                        Track your progress, completed tasks and
                        overall performance from this dashboard.
                    </p>
                </section>

            </div>

        </main>

    </div>

</body>
</html>
