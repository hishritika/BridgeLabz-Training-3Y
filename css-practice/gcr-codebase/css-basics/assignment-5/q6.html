<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <!-- Separate CSS file -->
    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments captured through photography</p>
    </header>

    <main class="gallery">

        <!-- Image 1 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                 alt="Mountain landscape">
            <div class="caption">Mountain Landscape</div>
        </div>

        <!-- Image 2 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Beautiful nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <!-- Image 3 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8"
                 alt="Sunset">
            <div class="caption">Golden Sunset</div>
        </div>

        <!-- Image 4 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                 alt="Green forest">
            <div class="caption">Green Forest</div>
        </div>

        <!-- Image 5 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <!-- Image 6 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969"
                 alt="Forest trees">
            <div class="caption">Forest Trees</div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Shritika. All Rights Reserved.</p>
    </footer>

</body>
</html>
