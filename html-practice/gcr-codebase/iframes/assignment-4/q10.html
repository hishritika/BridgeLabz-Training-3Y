<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>

<body>

    <h1>Contact Form</h1>

    <form>

        <!-- Full Name -->
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your full name" required>
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>
        <br><br>

        <!-- Subject -->
        <label>Subject:</label>
        <input type="text" placeholder="Enter the subject" required>
        <br><br>

        <!-- Message -->
        <label>Message:</label>
        <br>
        <textarea rows="5" cols="30" placeholder="Enter your message" required></textarea>
        <br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
