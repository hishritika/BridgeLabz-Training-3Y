<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>

<body>

    <h1>Secure Form</h1>

    <!-- Form with autocomplete turned off -->
    <form autocomplete="off">

        <!-- Username field -->
        <label>Username:</label>
        <input type="text" required>
        <br><br>

        <!-- Email field -->
        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <!-- Password field -->
        <label>Password:</label>
        <input type="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <!-- Security note -->
    <p>
        Turning off autocomplete can improve security by preventing the browser
        from automatically saving or filling sensitive information.
    </p>

</body>
</html>
