<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
</head>

<body>

    <h1>Payment Form</h1>

    <form>

        <!-- Cardholder Name -->
        <label>Cardholder Name:</label>
        <input type="text" required>
        <br><br>

        <!-- Card Number -->
        <label>Card Number:</label>
        <input type="text" required>
        <br><br>

        <!-- Expiry Date -->
        <label>Expiry Date:</label>
        <input type="text" required>
        <br><br>

        <!-- CVV -->
        <label>CVV:</label>
        <input type="text" required>
        <br><br>

        <!-- Payment button -->
        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
