<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information Form</title>
</head>

<body>

    <h1>Student Information Form</h1>

    <form>

        <!-- Name -->
        <label>Name:</label>
        <input type="text">
        <br><br>

        <!-- Roll Number -->
        <label>Roll Number:</label>
        <input type="text">
        <br><br>

        <!-- Course dropdown -->
        <label>Course:</label>

        <select>
            <option disabled selected>Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>BBA</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
