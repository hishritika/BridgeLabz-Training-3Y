<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>

<body>

    <h1>Long and Short Quotations</h1>

    <!-- Long quotation using blockquote -->
    <blockquote>
        Success comes from hard work, patience, and dedication.
        Keep learning &amp; never give up.
    </blockquote>

    <!-- Short quotation using q tag -->
    <p>
        My teacher always says, <q>Practice makes a person perfect.</q>
    </p>

</body>
</html>
