<html lang="en">
<head>

    <!-- Title of the webpage -->
    <title>Important Head Elements</title>

    <!-- Sets the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description" content="A webpage showing important head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Shritika">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource or favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Used for writing internal CSS -->
    <style>
    </style>

    <!-- Used for adding JavaScript -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>This page includes all important head elements.</p>

</body>
</html>
