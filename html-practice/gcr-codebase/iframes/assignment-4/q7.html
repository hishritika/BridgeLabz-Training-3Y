<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>

<body>

    <h1>Login Form</h1>

    <form>

        <!-- Username field -->
        <label>Username:</label>
        <input type="text">
        <br><br>

        <!-- Password field -->
        <label>Password:</label>
        <input type="password">
        <br><br>

        <!-- CSRF token helps protect the form from unauthorized requests -->
        <input type="hidden" name="csrf_token" value="dummy123">

        <input type="submit" value="Login">

    </form>

</body>
</html>
