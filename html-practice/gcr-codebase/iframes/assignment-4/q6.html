<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration Form</title>
</head>

<body>

    <h1>User Registration Form</h1>

    <form>

        <!-- Full Name -->
        <label>Full Name:</label>
        <input type="text">
        <br><br>

        <!-- Email Address -->
        <label>Email Address:</label>
        <input type="email">
        <br><br>

        <!-- Password -->
        <label>Password:</label>
        <input type="password">
        <br><br>

        <!-- Confirm Password -->
        <label>Confirm Password:</label>
        <input type="password">
        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
