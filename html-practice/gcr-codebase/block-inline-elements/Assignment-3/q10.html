<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <!-- Page Heading -->
    <h1>Travel Destination Selection</h1>

    <!-- Country Selection -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
    </select>

    <br><br>

    <!-- State Selection -->
    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <!-- City Selection -->
    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="agra" selected>Agra</option>
        <option value="lucknow">Lucknow</option>
        <option value="jaipur">Jaipur</option>
        <option value="mumbai">Mumbai</option>
    </select>

    <br><br>

    <!-- Favorite Tourist Place Selection -->
    <label for="tourist-place">Favorite Tourist Place:</label>
    <select id="tourist-place" name="tourist-place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="india-gate">India Gate</option>
        <option value="jaipur-fort">Jaipur Fort</option>
        <option value="gateway-of-india">Gateway of India</option>
    </select>

    <br><br>

    <!-- Summary of Selected Choices -->
    <p>
        Your selected destination is <strong>Agra, Uttar Pradesh, India</strong>,
        and your favorite tourist place is the <strong>Taj Mahal</strong>.
    </p>

</body>
</html>
