<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Name</label> <br>
        <input type="text" placeholder="Full Name"> <br>
        <label>Email</label> <br>
        <input type="email" placeholder="Enter Email"> <br>
        <label>Phone</label> <br>
        <input type="number" placeholder="Enter Phone"> <br>
        <label>Date of Birth</label> <br>
        <input type="date" placeholder="Enter DoB"> <br>
        <label>Password</label> <br>
        <input type="password" placeholder="Enter password"> <br>
        <br>

        <label>Gender</label> <br>
        <input type="radio" name="gender">
        <label for="">Male</label>
        <input type="radio" name="gender">
        <label for="">Female</label>
        <input type="radio" name="gender">
        <label for="">others</label> <br>
        <br>

        <label>Select Courses</label> 
        <select>
        <option value="">CSE</option>
        <option value="">IT</option>
        <option value="">ECE</option>
        <option value="">Mechanical</option> 
        </select> <br>
        <br>

        <label>Skills</label> <br>
        <input type="radio" name="skills">
        <label for="">Java</label>
        <input type="radio" name="skills">
        <label for="">JavaScript</label>
        <input type="radio" name="skills">
        <label for="">HTML</label>
        <input type="radio" name="skills">
        <label for="">CSS</label>
        <input type="radio" name="skills">
        <label for="">React</label>
        <br>
        <br>

        <label>Internship Preference</label> <br>
        <input type="radio" id="remote" name="internship">
        <label for="">Remote</label>

        <input type="radio" id="onsite" name="internship" >
        <label for="">On-site</label>

        <input type="radio" id="hybrid" name="internship" >
        <label for="">Hybrid</label> <br>
        <br>

        <label>Upload Resume:</label> <br>
        <input type="resume"> <br>
        <br>

        <label>Cover Letter:</label> <br>
        <textarea name="coverletter" id="coverletter" rows="8" cols="50" placeholder="Write your cover letter here..."></textarea> <br>
        <br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset Form">
    </form>
</body>
</html>
